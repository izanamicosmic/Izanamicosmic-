{"name":"Home","route":"/","auth":false,"lang":"id","home":true,"type":"page","title":"Beranda","info":"The public home page of the comic reader. Sections in order: (1) a compact hero carousel of 3 featured series (cover art, title such as 'Pendekar Bulan Merah', genre chips, 'Baca Chapter 1' button). (2) A responsive leaderboard banner ad slot (728x90 on desktop, 320x100 on mobile) loaded from the AdBanner entity with placement 'home_top'. (3) 'Lanjutkan Membaca' – a horizontal scroll row shown only to logged-in users, built from ReadingHistory sorted by lastReadAt desc: cover thumbnail, series title, 'Chapter 24 · 2 jam lalu' and a progress-style 'Lanjut' button that opens the Reader at that chapter; guests see a slim card inviting them to log in with Google or Facebook to save history. (4) 'Update Terbaru' – the main grid of cover thumbnails (2 columns on phone, 4 on tablet, 6 on desktop) from Chapter records sorted by releaseDate desc, grouped per comic: cover, title, the latest 2 chapter numbers with relative time ('Ch. 58 · 3 jam lalu'), a 'BARU' badge for chapters under 24 hours old, and a small bookmark icon (filled if the logged-in user bookmarked the series). Clicking a chapter opens the Reader page. (5) A second in-feed responsive banner ad (placement 'home_feed') inserted after the 12th grid item. (6) 'Semua Judul' – an A–Z grid of all Comic records with genre filter chips (Aksi, Fantasi, Romansa, Komedi, Horor) and a status filter (Ongoing / Tamat). Footer with short about text and links.","code":"function Home() {\n  const t = {\n    wrap: \"mx-auto w-full max-w-[1280px] px-4 md:px-8\",\n    section: \"py-8 md:py-12\",\n    btn: \"inline-flex items-center justify-center gap-2 rounded-btn-radius bg-btn-primary-bg px-6 py-3 text-sm font-bold text-btn-primary-text transition hover:bg-btn-primary-hover active:scale-95 disabled:cursor-not-allowed disabled:opacity-60\",\n    btnGhost: \"inline-flex items-center justify-center gap-2 rounded-btn-radius bg-white/15 px-4 py-3 text-sm font-semibold text-white backdrop-blur transition hover:bg-white/25 active:scale-95\",\n    btnOutline: \"inline-flex items-center justify-center gap-2 rounded-btn-radius border-2 border-primary px-5 py-2.5 text-sm font-bold text-primary transition hover:bg-primary-light active:scale-95\",\n    chipOn: \"rounded-full bg-primary px-4 py-1.5 text-sm font-semibold text-primary-text transition\",\n    chipOff: \"rounded-full border border-surface-3 bg-surface-2 px-4 py-1.5 text-sm font-semibold text-text-secondary transition hover:border-primary hover:text-text\",\n    cover: \"block w-full overflow-hidden rounded-[10px] border-2 border-surface-3 transition duration-300 group-hover:-translate-y-1 group-hover:border-primary group-hover:shadow-[0_10px_30px_rgba(99,102,241,0.4)]\",\n    title: \"mt-2.5 line-clamp-1 text-left text-sm font-bold text-text md:text-[15px]\",\n    chLine: \"flex w-full items-center justify-between gap-2 py-0.5 text-left text-[13px] text-text-secondary transition hover:text-accent\",\n    bm: \"absolute right-1.5 top-1.5 flex h-8 w-8 items-center justify-center rounded-full bg-black/60 text-white backdrop-blur transition hover:scale-110 hover:bg-black/80\",\n    heroChip: \"rounded-full bg-white/15 px-3 py-1 text-xs font-semibold text-white backdrop-blur\",\n    rowCard: \"flex min-w-[290px] max-w-[320px] shrink-0 snap-start gap-3 rounded-card-radius border border-surface-3 bg-surface-2 p-3 transition hover:border-primary\",\n    grid: \"grid grid-cols-2 gap-x-3 gap-y-6 sm:grid-cols-4 sm:gap-x-4 lg:grid-cols-6\"\n  };\n\n  const PHOTO_MANGA = \"https://cdn.yeshbecdn.com/yeshbe/app/737/stock/b4f5315a4de944d02a4e7ff3fec7c2a9b31fb4be.jpg\";\n  const PHOTO_READ = \"https://cdn.yeshbecdn.com/yeshbe/app/737/stock/0e78c123b2a7e728e2e28a11a407f132660f44c4.jpg\";\n  const GL = { action: \"Aksi\", fantasy: \"Fantasi\", romance: \"Romansa\", comedy: \"Komedi\", horror: \"Horor\", drama: \"Drama\" };\n  const SL = { ongoing: \"Ongoing\", completed: \"Tamat\" };\n  const dotsWhite = { backgroundImage: \"radial-gradient(rgba(255,255,255,.9) 1px, transparent 1.4px)\", backgroundSize: \"6px 6px\" };\n  const dotsPrimary = { backgroundImage: \"radial-gradient(var(--primary) 1.6px, transparent 1.8px)\", backgroundSize: \"9px 9px\" };\n\n  const [comics, setComics] = useState([]);\n  const [chapters, setChapters] = useState([]);\n  const [ads, setAds] = useState([]);\n  const [loading, setLoading] = useState(true);\n  const [err, setErr] = useState(\"\");\n  const [reload, setReload] = useState(0);\n  const [bms, setBms] = useState([]);\n  const [hist, setHist] = useState([]);\n  const [genre, setGenre] = useState(\"all\");\n  const [status, setStatus] = useState(\"all\");\n  const [updVisible, setUpdVisible] = useState(24);\n  const [allVisible, setAllVisible] = useState(18);\n  const [slide, setSlide] = useState(0);\n  const busy = useRef({});\n  const [emblaRef, emblaApi] = useEmblaCarousel({ loop: true, direction: dir });\n\n  useEffect(() => {\n    let alive = true;\n    setLoading(true);\n    setErr(\"\");\n    (async () => {\n      try {\n        const [a, b, c] = await Promise.all([\n          sdk.getPublicAll(\"Comic\", { limit: 300 }),\n          sdk.getPublicAll(\"Chapter\", { limit: 500, sort: { field: \"releaseDate\", direction: \"desc\" } }),\n          sdk.getPublicAll(\"AdBanner\", { limit: 50 }).catch(() => ({ data: [] }))\n        ]);\n        if (!alive) return;\n        setComics(a.data || []);\n        setChapters(b.data || []);\n        setAds(c.data || []);\n      } catch (e) {\n        if (alive) setErr(e.message || \"Gagal memuat komik. Coba lagi sebentar lagi.\");\n      } finally {\n        if (alive) setLoading(false);\n      }\n    })();\n    return () => { alive = false; };\n  }, [reload]);\n\n  useEffect(() => {\n    if (!isLoggedIn) { setBms([]); setHist([]); return; }\n    let alive = true;\n    (async () => {\n      try {\n        const [b, h] = await Promise.all([\n          sdk.getAll(\"Bookmark\", { limit: 200 }),\n          sdk.getAll(\"ReadingHistory\", { limit: 40, sort: { field: \"lastReadAt\", direction: \"desc\" } })\n        ]);\n        if (!alive) return;\n        setBms((b.data || []).sort((x, y) => new Date(y.createdDate || 0) - new Date(x.createdDate || 0)));\n        const seen = {};\n        setHist((h.data || []).sort((x, y) => new Date(y.lastReadAt) - new Date(x.lastReadAt)).filter(r => {\n          const k = String(r.comicId);\n          if (seen[k]) return false;\n          seen[k] = 1;\n          return true;\n        }));\n      } catch (e) {}\n    })();\n    return () => { alive = false; };\n  }, [isLoggedIn]);\n\n  const comicMap = useMemo(() => { const m = {}; comics.forEach(c => { m[String(c.id)] = c; }); return m; }, [comics]);\n  const chapMap = useMemo(() => { const m = {}; chapters.forEach(c => { m[String(c.id)] = c; }); return m; }, [chapters]);\n  const { byComic, first } = useMemo(() => {\n    const g = {}, f = {};\n    chapters.forEach(ch => { const k = String(ch.comicId); (g[k] = g[k] || []).push(ch); });\n    Object.keys(g).forEach(k => {\n      g[k].sort((x, y) => new Date(y.releaseDate) - new Date(x.releaseDate) || y.number - x.number);\n      f[k] = g[k].reduce((a, b) => (b.number < a.number ? b : a));\n    });\n    return { byComic: g, first: f };\n  }, [chapters]);\n  const latest = useMemo(() => comics\n    .filter(c => byComic[String(c.id)])\n    .map(c => ({ comic: c, chs: byComic[String(c.id)] }))\n    .sort((a, b) => new Date(b.chs[0].releaseDate) - new Date(a.chs[0].releaseDate)), [comics, byComic]);\n  const heroList = useMemo(() => {\n    const f = comics.filter(c => c.isFeatured).slice(0, 3);\n    return f.length ? f : latest.slice(0, 3).map(x => x.comic);\n  }, [comics, latest]);\n  const filtered = useMemo(() => comics\n    .filter(c => (genre === \"all\" || c.genre === genre) && (status === \"all\" || c.status === status))\n    .sort((a, b) => (a.title || \"\").localeCompare(b.title || \"\")), [comics, genre, status]);\n  const bmSet = useMemo(() => { const s = {}; bms.forEach(b => { s[String(b.comicId)] = true; }); return s; }, [bms]);\n\n  useEffect(() => {\n    if (!emblaApi) return;\n    emblaApi.reInit();\n    const on = () => setSlide(emblaApi.selectedScrollSnap());\n    emblaApi.on(\"select\", on);\n    on();\n    const id = setInterval(() => emblaApi.scrollNext(), 6500);\n    return () => { clearInterval(id); emblaApi.off(\"select\", on); };\n  }, [emblaApi, heroList.length]);\n\n  const ago = (d) => {\n    if (!d) return \"\";\n    const s = (Date.now() - new Date(d).getTime()) / 1000;\n    if (s < 60) return \"baru saja\";\n    const m = Math.floor(s / 60);\n    if (m < 60) return m + \" menit lalu\";\n    const h = Math.floor(m / 60);\n    if (h < 24) return h + \" jam lalu\";\n    const dd = Math.floor(h / 24);\n    if (dd < 30) return dd + \" hari lalu\";\n    const mo = Math.floor(dd / 30);\n    if (mo < 12) return mo + \" bulan lalu\";\n    return Math.floor(mo / 12) + \" tahun lalu\";\n  };\n  const isNew = (d) => d && Date.now() - new Date(d).getTime() < 864e5;\n\n  const openRead = (comicId, chapterId) => {\n    if (!chapterId) { toast(\"Belum ada chapter untuk judul ini\"); return; }\n    navigateTo(\"Reader\", { comicId, chapterId }, activeLang, { comicId, chapterId });\n  };\n  const openLatest = (c) => { const l = byComic[String(c.id)]; openRead(c.id, l && l[0].id); };\n  const openFirst = (c) => { const f = first[String(c.id)]; openRead(c.id, f && f.id); };\n\n  const toggleBm = async (comic) => {\n    if (!isLoggedIn) {\n      toast(\"Masuk dulu untuk menyimpan bookmark\", { action: { label: \"Masuk\", onClick: () => navigateTo(\"Login\") } });\n      return;\n    }\n    const key = String(comic.id);\n    if (busy.current[key]) return;\n    busy.current[key] = true;\n    const ex = bms.find(b => String(b.comicId) === key);\n    try {\n      if (ex) {\n        await sdk.del(\"Bookmark\", ex.id);\n        setBms(p => p.filter(b => b.id !== ex.id));\n        toast.success(\"Dihapus dari bookmark\");\n      } else {\n        const now = new Date().toISOString();\n        const r = await sdk.save(\"Bookmark\", { comicId: comic.id, createdDate: now });\n        setBms(p => [{ id: r.id, comicId: comic.id, createdDate: now }, ...p]);\n        toast.success(\"Ditambahkan ke bookmark\");\n      }\n    } catch (e) {\n      toast.error(e.message || \"Gagal memperbarui bookmark\");\n    } finally {\n      busy.current[key] = false;\n    }\n  };\n\n  const adFor = (p) => ads.find(a => a.placement === p && a.isActive !== false);\n\n  const rAd = (ad) => {\n    if (!ad) return null;\n    const hasImg = ad.imageDesktopUrl || ad.imageMobileUrl;\n    return (\n      <div className=\"mx-auto w-full max-w-[728px]\">\n        <div className=\"mb-1 text-center text-[10px] font-semibold uppercase tracking-[0.25em] text-text-muted\">Iklan</div>\n        <div className=\"overflow-hidden rounded-lg border border-dashed border-text-muted bg-surface-2\">\n          {hasImg ? (\n            <a href={ad.linkUrl || \"#\"} target=\"_blank\" rel=\"noopener noreferrer sponsored\" className=\"block\">\n              <picture>\n                {ad.imageDesktopUrl && <source media=\"(min-width: 768px)\" srcSet={ad.imageDesktopUrl} />}\n                <img src={ad.imageMobileUrl || ad.imageDesktopUrl} alt={ad.name || \"Iklan\"} loading=\"lazy\" className=\"mx-auto h-auto w-full\" />\n              </picture>\n            </a>\n          ) : ad.adCode ? (\n            <iframe title={ad.name || \"Iklan\"} srcDoc={ad.adCode} sandbox=\"allow-scripts allow-popups allow-same-origin\" className=\"mx-auto block h-[100px] w-full md:h-[90px]\" />\n          ) : null}\n        </div>\n      </div>\n    );\n  };\n\n  const rHead = (title, right, count) => (\n    <div className=\"mb-5 flex items-center gap-3\">\n      <span className=\"h-8 w-2 rounded-sm bg-primary\" />\n      <h2 className=\"text-3xl uppercase tracking-wider text-text md:text-4xl\">{title}</h2>\n      {count != null && <span className=\"rounded-full bg-surface-3 px-2.5 py-0.5 text-xs font-bold text-text-secondary\">{count}</span>}\n      <span className=\"hidden h-2 flex-1 opacity-40 sm:block\" style={dotsPrimary} />\n      {right}\n    </div>\n  );\n\n  const rCover = (c, eager) => (\n    <div className=\"relative aspect-[3/4] w-full overflow-hidden bg-gradient-to-br from-primary-light to-surface-3\">\n      <span className=\"absolute inset-0 flex items-end p-3 font-heading text-xl leading-tight tracking-wide text-text-muted\">{c.title}</span>\n      {c.coverUrl && (\n        <img src={c.coverUrl} alt={\"Sampul \" + c.title} loading={eager ? \"eager\" : \"lazy\"}\n          onError={(e) => { e.currentTarget.style.visibility = \"hidden\"; }}\n          className=\"absolute inset-0 h-full w-full object-cover transition duration-500 group-hover:scale-105\" />\n      )}\n    </div>\n  );\n\n  const rBm = (c) => {\n    const on = !!bmSet[String(c.id)];\n    return (\n      <button onClick={() => toggleBm(c)} className={t.bm} aria-label={on ? \"Hapus bookmark\" : \"Tambah bookmark\"} aria-pressed={on}>\n        <Bookmark size={16} className={on ? \"fill-current text-accent\" : \"\"} />\n      </button>\n    );\n  };\n\n  const rBaru = () => (\n    <motion.span initial={{ scale: 0.4, rotate: -20, opacity: 0 }} animate={{ scale: 1, rotate: -8, opacity: 1 }} transition={{ type: \"spring\", stiffness: 300, damping: 14, delay: 0.3 }}\n      className=\"absolute -left-2 -top-2 z-10 rounded-xl bg-accent px-2.5 py-0.5 font-heading text-base tracking-wider text-background shadow-lg\">\n      BARU\n      <span className=\"absolute -bottom-1 left-2.5 h-2.5 w-2.5 rotate-45 bg-accent\" />\n    </motion.span>\n  );\n\n  const rUpdateCard = (item, i) => {\n    const { comic, chs } = item;\n    return (\n      <motion.article key={comic.id} initial={{ opacity: 0, y: 14 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.4, delay: (i % 6) * 0.05 }} className=\"group min-w-0\">\n        <div className=\"relative\">\n          <button onClick={() => openRead(comic.id, chs[0].id)} className={t.cover} aria-label={\"Baca \" + comic.title}>{rCover(comic, i < 6)}</button>\n          {isNew(chs[0].releaseDate) && rBaru()}\n          {rBm(comic)}\n        </div>\n        <button onClick={() => openRead(comic.id, chs[0].id)} className={t.title + \" w-full\"}>{comic.title}</button>\n        <div className=\"mt-1 border-t border-dashed border-surface-3 pt-1\">\n          {chs.slice(0, 2).map(ch => (\n            <button key={ch.id} onClick={() => openRead(comic.id, ch.id)} className={t.chLine}>\n              <span className=\"font-semibold text-text\">Ch. {ch.number}</span>\n              <span className=\"truncate text-[12px] text-text-muted\">{ago(ch.releaseDate)}</span>\n            </button>\n          ))}\n        </div>\n      </motion.article>\n    );\n  };\n\n  const rTitleCard = (c, i) => (\n    <motion.article key={c.id} initial={{ opacity: 0, y: 14 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.4, delay: (i % 6) * 0.04 }} className=\"group min-w-0\">\n      <div className=\"relative\">\n        <button onClick={() => openLatest(c)} className={t.cover} aria-label={\"Baca \" + c.title}>{rCover(c)}</button>\n        <span className=\"absolute bottom-1.5 left-1.5 rounded-md bg-black/70 px-2 py-0.5 text-[11px] font-bold text-white backdrop-blur\">{SL[c.status] || \"Ongoing\"}</span>\n        {rBm(c)}\n      </div>\n      <h3 className={t.title}>{c.title}</h3>\n      <p className=\"text-[13px] text-text-muted\">{GL[c.genre] || \"Umum\"}{c.author ? \" · \" + c.author : \"\"}</p>\n    </motion.article>\n  );\n\n  const rSkeletonGrid = (n) => (\n    <div className={t.grid}>\n      {Array.from({ length: n }).map((_, i) => (\n        <div key={i} className=\"animate-pulse\">\n          <div className=\"aspect-[3/4] rounded-[10px] bg-surface-2\" />\n          <div className=\"mt-3 h-3 w-4/5 rounded bg-surface-2\" />\n          <div className=\"mt-2 h-3 w-3/5 rounded bg-surface-2\" />\n        </div>\n      ))}\n    </div>\n  );\n\n  const rHero = () => {\n    if (loading) return <div className=\"h-[440px] animate-pulse rounded-2xl bg-surface-2 md:h-[420px]\" />;\n    if (!heroList.length) {\n      return (\n        <div className=\"relative overflow-hidden rounded-2xl border-2 border-surface-3\">\n          <img src={PHOTO_MANGA} alt=\"Tumpukan komik dan manga\" className=\"absolute inset-0 h-full w-full object-cover\" />\n          <div className=\"absolute inset-0 bg-black/70\" />\n          <div className=\"absolute inset-0 opacity-15\" style={dotsWhite} />\n          <div className=\"relative p-8 md:p-14\">\n            <h1 className=\"text-5xl uppercase tracking-wide text-white md:text-7xl\">Rak komik masih kosong</h1>\n            <p className=\"mt-3 max-w-md text-white\">Judul pertama sedang disiapkan. Masuk dengan Google atau Facebook supaya bookmark dan riwayat bacamu siap saat komik pertama tayang.</p>\n            {!isLoggedIn && <button onClick={() => navigateTo(\"Login\")} className={t.btn + \" mt-6\"}><LogIn size={18} /> Masuk Sekarang</button>}\n          </div>\n        </div>\n      );\n    }\n    return (\n      <div className=\"relative overflow-hidden rounded-2xl border-2 border-surface-3\">\n        <div ref={emblaRef} className=\"overflow-hidden\">\n          <div className=\"flex\">\n            {heroList.map((c, i) => {\n              const f = first[String(c.id)];\n              return (\n                <div key={c.id} className=\"min-w-0 shrink-0 grow-0 basis-full\">\n                  <div className=\"relative flex min-h-[440px] items-end md:min-h-[420px]\">\n                    {c.coverUrl && <img src={c.coverUrl} alt=\"\" loading={i === 0 ? \"eager\" : \"lazy\"} className=\"absolute inset-0 h-full w-full object-cover object-center\" />}\n                    <div className=\"absolute inset-0 bg-gradient-to-r from-black/90 via-black/60 to-black/20\" />\n                    <div className=\"absolute inset-0 bg-gradient-to-t from-black/80 to-transparent\" />\n                    <div className=\"absolute inset-0 opacity-15\" style={dotsWhite} />\n                    <div className=\"relative grid w-full items-end gap-8 p-6 pb-14 md:grid-cols-[1fr_210px] md:p-12 md:pb-14\">\n                      <div className=\"max-w-2xl\">\n                        <span className=\"relative mb-4 inline-block rounded-xl bg-accent px-3 py-1 font-heading text-base tracking-wider text-background\">\n                          PILIHAN MALAM INI\n                          <span className=\"absolute -bottom-1 left-4 h-2.5 w-2.5 rotate-45 bg-accent\" />\n                        </span>\n                        <h1 className=\"text-5xl uppercase leading-[0.95] tracking-wide text-white md:text-7xl\">{c.title}</h1>\n                        <div className=\"mt-4 flex flex-wrap gap-2\">\n                          <span className={t.heroChip}>{GL[c.genre] || \"Umum\"}</span>\n                          <span className={t.heroChip}>{SL[c.status] || \"Ongoing\"}</span>\n                          {c.author && <span className={t.heroChip}>{c.author}</span>}\n                        </div>\n                        {c.synopsis && <p className=\"mt-4 line-clamp-2 max-w-xl text-sm leading-relaxed text-white md:text-base\">{c.synopsis}</p>}\n                        <div className=\"mt-6 flex flex-wrap gap-3\">\n                          <button onClick={() => openRead(c.id, f && f.id)} className={t.btn}>\n                            <Play size={18} className=\"fill-current\" /> Baca Chapter {f ? f.number : 1}\n                          </button>\n                          <button onClick={() => toggleBm(c)} className={t.btnGhost}>\n                            <Bookmark size={18} className={bmSet[String(c.id)] ? \"fill-current\" : \"\"} />\n                            {bmSet[String(c.id)] ? \"Tersimpan\" : \"Simpan\"}\n                          </button>\n                        </div>\n                      </div>\n                      <div className=\"hidden md:block\">\n                        <div className=\"rotate-3 overflow-hidden rounded-[10px] border-2 border-white/30 shadow-[0_16px_40px_rgba(0,0,0,0.6)]\">\n                          <div className=\"relative aspect-[3/4] bg-surface-3\">\n                            {c.coverUrl && <img src={c.coverUrl} alt={\"Sampul \" + c.title} className=\"absolute inset-0 h-full w-full object-cover\" />}\n                          </div>\n                        </div>\n                      </div>\n                    </div>\n                  </div>\n                </div>\n              );\n            })}\n          </div>\n        </div>\n        {heroList.length > 1 && (\n          <div className=\"absolute bottom-5 left-6 z-10 flex gap-2 md:left-12\">\n            {heroList.map((c, i) => (\n              <button key={c.id} onClick={() => emblaApi && emblaApi.scrollTo(i)} aria-label={\"Slide \" + (i + 1)}\n                className={\"h-3 -skew-x-12 border-2 border-white transition-all duration-300 \" + (slide === i ? \"w-10 bg-primary\" : \"w-5 bg-transparent hover:bg-white/40\")} />\n            ))}\n          </div>\n        )}\n      </div>\n    );\n  };\n\n  const rContinue = () => {\n    if (!isLoggedIn) {\n      return (\n        <div className=\"relative overflow-hidden rounded-card-radius border-2 border-surface-3 bg-surface-2\">\n          <img src={PHOTO_READ} alt=\"Membaca di ponsel\" loading=\"lazy\" className=\"absolute inset-0 h-full w-full object-cover\" />\n          <div className=\"absolute inset-0 bg-black/70\" />\n          <div className=\"relative flex flex-col gap-5 p-5 md:flex-row md:items-center md:justify-between md:p-7\">\n            <div className=\"flex items-start gap-4\">\n              <div className=\"flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-primary text-white\"><BookOpen size={22} /></div>\n              <div>\n                <h3 className=\"text-2xl uppercase tracking-wider text-white md:text-3xl\">Simpan riwayat bacamu</h3>\n                <p className=\"mt-1 max-w-lg text-sm text-white\">Masuk dengan Google atau Facebook untuk melanjutkan chapter terakhir dan menyimpan series favorit di semua perangkat.</p>\n              </div>\n            </div>\n            <div className=\"flex flex-wrap gap-3\">\n              <button onClick={() => navigateTo(\"Login\")} className=\"inline-flex items-center gap-2 rounded-btn-radius bg-white px-5 py-3 text-sm font-bold text-black transition hover:scale-105 active:scale-95\">\n                <span className=\"flex h-5 w-5 items-center justify-center rounded-full border border-black text-[11px] font-black\">G</span> Google\n              </button>\n              <button onClick={() => navigateTo(\"Login\")} className=\"inline-flex items-center gap-2 rounded-btn-radius bg-info px-5 py-3 text-sm font-bold text-white transition hover:scale-105 active:scale-95\">\n                <span className=\"flex h-5 w-5 items-center justify-center rounded-full bg-white text-[13px] font-black text-info\">f</span> Facebook\n              </button>\n            </div>\n          </div>\n        </div>\n      );\n    }\n    if (!hist.length) {\n      return (\n        <div className=\"flex items-center gap-4 rounded-card-radius border border-dashed border-text-muted bg-surface-2 p-5\">\n          <BookOpen size={26} className=\"shrink-0 text-primary\" />\n          <p className=\"text-sm text-text-secondary\">Belum ada riwayat bacaan. Buka satu chapter dan ia akan muncul di sini untuk dilanjutkan kapan saja.</p>\n        </div>\n      );\n    }\n    return (\n      <div className=\"-mx-4 flex snap-x gap-4 overflow-x-auto px-4 pb-3 md:mx-0 md:px-0\">\n        {hist.map(h => {\n          const c = comicMap[String(h.comicId)];\n          if (!c) return null;\n          const ch = chapMap[String(h.chapterId)];\n          const list = byComic[String(c.id)] || [];\n          const max = list.length ? Math.max.apply(null, list.map(x => x.number)) : 0;\n          const pct = ch && max ? Math.min(100, Math.round((ch.number / max) * 100)) : 0;\n          return (\n            <div key={h.id} className={t.rowCard + \" group\"}>\n              <button onClick={() => openRead(c.id, h.chapterId)} className=\"w-[72px] shrink-0 overflow-hidden rounded-lg border-2 border-surface-3 transition group-hover:border-primary\" aria-label={\"Lanjut baca \" + c.title}>{rCover(c)}</button>\n              <div className=\"flex min-w-0 flex-1 flex-col justify-between\">\n                <div>\n                  <h3 className=\"line-clamp-1 text-sm font-bold text-text\">{c.title}</h3>\n                  <p className=\"mt-0.5 text-[13px] text-text-muted\">{ch ? \"Chapter \" + ch.number + \" · \" : \"\"}{ago(h.lastReadAt)}</p>\n                </div>\n                <div>\n                  <div className=\"mb-2 h-1.5 overflow-hidden rounded-full bg-surface-3\"><div className=\"h-full rounded-full bg-accent\" style={{ width: pct + \"%\" }} /></div>\n                  <button onClick={() => openRead(c.id, h.chapterId)} className=\"inline-flex items-center gap-1.5 rounded-full bg-primary px-4 py-1.5 text-xs font-bold text-primary-text transition hover:bg-primary-hover active:scale-95\">\n                    <Play size={12} className=\"fill-current\" /> Lanjut\n                  </button>\n                </div>\n              </div>\n            </div>\n          );\n        })}\n      </div>\n    );\n  };\n\n  const myBms = bms.map(b => comicMap[String(b.comicId)]).filter(Boolean);\n  const updItems = latest.slice(0, updVisible);\n  const feedAd = adFor(\"home_feed\");\n\n  return (\n    <div className=\"pb-10\">\n      <section className={t.wrap + \" pt-5 md:pt-8\"}>{rHero()}</section>\n\n      {adFor(\"home_top\") && <section className={t.wrap + \" pt-8\"}>{rAd(adFor(\"home_top\"))}</section>}\n\n      <section className={t.wrap + \" \" + t.section}>\n        {rHead(\"Lanjutkan Membaca\")}\n        {rContinue()}\n      </section>\n\n      {isLoggedIn && myBms.length > 0 && (\n        <section id=\"bookmark\" className={t.wrap + \" pb-8 md:pb-12\"}>\n          {rHead(\"Bookmark Saya\", null, myBms.length)}\n          <div className=\"-mx-4 flex snap-x gap-4 overflow-x-auto px-4 pb-3 md:mx-0 md:px-0\">\n            {myBms.map(c => {\n              const l = byComic[String(c.id)];\n              return (\n                <div key={c.id} className=\"group w-[130px] shrink-0 snap-start md:w-[152px]\">\n                  <div className=\"relative\">\n                    <button onClick={() => openLatest(c)} className={t.cover} aria-label={\"Baca \" + c.title}>{rCover(c)}</button>\n                    {l && isNew(l[0].releaseDate) && rBaru()}\n                    {rBm(c)}\n                  </div>\n                  <h3 className={t.title}>{c.title}</h3>\n                  <p className=\"text-[13px] text-text-muted\">{l ? \"Ch. \" + l[0].number + \" · \" + ago(l[0].releaseDate) : SL[c.status]}</p>\n                </div>\n              );\n            })}\n          </div>\n        </section>\n      )}\n\n      <section id=\"update\" className={t.wrap + \" \" + t.section}>\n        {rHead(\"Update Terbaru\", <span className=\"flex items-center gap-1.5 text-xs font-semibold text-text-muted\"><Clock size={14} /> Diperbarui tiap hari</span>)}\n        {loading ? rSkeletonGrid(12) : err ? (\n          <div className=\"flex flex-col items-center gap-4 rounded-card-radius border border-surface-3 bg-surface-2 p-10 text-center\">\n            <AlertCircle size={34} className=\"text-error\" />\n            <p className=\"max-w-sm text-sm text-text-secondary\">{err}</p>\n            <button onClick={() => setReload(reload + 1)} className={t.btn}>Coba Lagi</button>\n          </div>\n        ) : !updItems.length ? (\n          <div className=\"relative overflow-hidden rounded-card-radius border border-surface-3 bg-surface-2 p-10 text-center\">\n            <div className=\"absolute inset-0 opacity-20\" style={dotsPrimary} />\n            <div className=\"relative\">\n              <BookOpen size={34} className=\"mx-auto text-primary\" />\n              <h3 className=\"mt-3 text-3xl uppercase tracking-wider text-text\">Belum ada chapter</h3>\n              <p className=\"mx-auto mt-1 max-w-sm text-sm text-text-secondary\">Update terbaru akan muncul di sini begitu chapter pertama dirilis.</p>\n            </div>\n          </div>\n        ) : (\n          <>\n            <div className={t.grid}>\n              {updItems.map((it, i) => (\n                <React.Fragment key={it.comic.id}>\n                  {rUpdateCard(it, i)}\n                  {i === 11 && feedAd && <div className=\"col-span-full py-2\">{rAd(feedAd)}</div>}\n                </React.Fragment>\n              ))}\n              {updItems.length < 12 && feedAd && <div className=\"col-span-full py-2\">{rAd(feedAd)}</div>}\n            </div>\n            {latest.length > updVisible && (\n              <div className=\"mt-8 text-center\">\n                <button onClick={() => setUpdVisible(updVisible + 12)} className={t.btnOutline}>Muat Lebih Banyak <ChevronDown size={16} /></button>\n              </div>\n            )}\n          </>\n        )}\n      </section>\n\n      <section id=\"judul\" className={t.wrap + \" \" + t.section}>\n        {rHead(\"Semua Judul\", null, loading ? null : filtered.length)}\n        <div className=\"mb-6 flex flex-col gap-3 rounded-card-radius border border-surface-3 bg-surface-2 p-3 md:flex-row md:items-center md:justify-between md:p-4\">\n          <div className=\"flex flex-wrap gap-2\" role=\"group\" aria-label=\"Filter genre\">\n            {[[\"all\", \"Semua\"]].concat(Object.keys(GL).map(k => [k, GL[k]])).map(([k, l]) => (\n              <button key={k} onClick={() => { setGenre(k); setAllVisible(18); }} className={genre === k ? t.chipOn : t.chipOff}>{l}</button>\n            ))}\n          </div>\n          <div className=\"flex flex-wrap items-center gap-2\" role=\"group\" aria-label=\"Filter status\">\n            <Filter size={16} className=\"hidden text-text-muted md:block\" />\n            {[[\"all\", \"Semua Status\"], [\"ongoing\", \"Ongoing\"], [\"completed\", \"Tamat\"]].map(([k, l]) => (\n              <button key={k} onClick={() => { setStatus(k); setAllVisible(18); }} className={status === k ? t.chipOn : t.chipOff}>{l}</button>\n            ))}\n          </div>\n        </div>\n        {loading ? rSkeletonGrid(12) : !filtered.length ? (\n          <div className=\"rounded-card-radius border border-dashed border-text-muted bg-surface-2 p-10 text-center\">\n            <Search size={30} className=\"mx-auto text-text-muted\" />\n            <p className=\"mt-3 text-sm text-text-secondary\">Tidak ada judul yang cocok dengan filter ini.</p>\n            <button onClick={() => { setGenre(\"all\"); setStatus(\"all\"); }} className={t.btnOutline + \" mt-4\"}>Reset Filter</button>\n          </div>\n        ) : (\n          <>\n            <div className={t.grid}>{filtered.slice(0, allVisible).map((c, i) => rTitleCard(c, i))}</div>\n            {filtered.length > allVisible && (\n              <div className=\"mt-8 text-center\">\n                <button onClick={() => setAllVisible(allVisible + 18)} className={t.btnOutline}>Tampilkan Lebih Banyak <ChevronDown size={16} /></button>\n              </div>\n            )}\n          </>\n        )}\n      </section>\n    </div>\n  );\n}","seo":{"title":"KomikMalam – Baca Komik Online, Update Terbaru","description":"Baca komik online gratis di KomikMalam. Update chapter terbaru tiap hari, bookmark series favorit, dan lanjutkan bacaan terakhirmu di HP maupun desktop."}}
{"name":"Login","route":"/login","auth":false,"lang":"id","home":false,"type":"login","title":"Masuk","info":"Centered login card on a dark background with a faint collage of comic panels behind it. Headline 'Masuk ke KomikMalam' and subline 'Simpan bookmark dan riwayat bacaanmu di semua perangkat'. Two large social buttons first: 'Masuk dengan Google' and 'Masuk dengan Facebook'. Below a divider 'atau', an email + password form with a switch between 'Masuk' and 'Daftar' (sign up adds a full name field). Small benefits list: bookmark seri favorit, lanjutkan dari chapter terakhir, notifikasi update. After login the user returns to the page they came from.","code":"function Login() {\n  const t = {\n    page: \"relative isolate flex min-h-[calc(100svh-64px)] items-center justify-center overflow-hidden px-4 py-10 md:py-16\",\n    collage: \"pointer-events-none absolute inset-0 -z-10\",\n    collageGrid: \"absolute -inset-16 grid -rotate-6 grid-cols-2 gap-3 opacity-30 md:grid-cols-4\",\n    panel: \"relative flex h-44 items-center justify-center overflow-hidden rounded-card-radius border-2 border-background bg-gradient-to-br md:h-56\",\n    halftone: \"absolute inset-0 text-white opacity-20 [background-image:radial-gradient(circle,currentColor_1.5px,transparent_1.5px)] [background-size:10px_10px]\",\n    panelWord: \"relative font-heading text-5xl uppercase tracking-wider text-white/40 md:text-6xl\",\n    fade: \"absolute inset-0 bg-gradient-to-b from-background via-transparent to-background\",\n    card: \"relative w-full max-w-md rounded-2xl border-2 border-border bg-surface-2 p-6 shadow-shadow-xl sm:p-8\",\n    logoTile: \"mx-auto mb-4 flex h-14 w-14 -rotate-6 items-center justify-center rounded-2xl border-2 border-background bg-primary text-white shadow-shadow-lg\",\n    brand: \"text-center font-heading text-sm uppercase tracking-[0.25em] text-accent\",\n    h1: \"mt-1 text-center font-heading text-4xl uppercase leading-none tracking-wide text-text sm:text-5xl\",\n    sub: \"mx-auto mt-3 max-w-xs text-center text-[14px] leading-relaxed text-text-secondary\",\n    social: \"flex w-full items-center justify-center gap-3 rounded-btn-radius border border-border bg-surface-3 px-5 py-3.5 text-[15px] font-semibold text-text transition duration-200 hover:-translate-y-0.5 hover:border-primary hover:shadow-shadow-md disabled:cursor-not-allowed disabled:opacity-60\",\n    divider: \"my-6 flex items-center gap-4 text-xs font-semibold uppercase tracking-[0.2em] text-text-muted\",\n    line: \"h-px flex-1 bg-border\",\n    seg: \"mb-5 grid grid-cols-2 gap-1 rounded-xl bg-background p-1\",\n    segOn: \"rounded-lg bg-primary px-4 py-2 text-sm font-bold text-white shadow-shadow-sm transition\",\n    segOff: \"rounded-lg px-4 py-2 text-sm font-bold text-text-muted transition hover:text-text\",\n    label: \"mb-1.5 block text-[13px] font-semibold text-text-secondary\",\n    input: \"w-full rounded-input-radius border border-border bg-background px-4 py-3 text-[15px] text-text placeholder:text-text-muted transition focus:border-border-focus focus:outline-none\",\n    btn: \"inline-flex w-full items-center justify-center gap-2 rounded-btn-radius bg-btn-primary-bg px-6 py-3.5 text-[15px] font-bold text-btn-primary-text transition duration-200 hover:bg-btn-primary-hover hover:-translate-y-0.5 disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0\",\n    ghost: \"inline-flex w-full items-center justify-center gap-2 rounded-btn-radius border border-border bg-surface-3 px-6 py-3 text-[14px] font-semibold text-text transition hover:border-primary\",\n    err: \"mb-4 flex items-start gap-2 rounded-xl border border-error bg-background px-4 py-3 text-[13px] text-error\",\n    benefits: \"mt-7 space-y-3 border-t border-dashed border-border pt-6\",\n    benefit: \"flex items-center gap-3 text-[13px] text-text-secondary\",\n    benefitIcon: \"flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-primary-light text-primary\"\n  };\n\n  const [mode, setMode] = useState(\"login\");\n  const [name, setName] = useState(\"\");\n  const [email, setEmail] = useState(\"\");\n  const [password, setPassword] = useState(\"\");\n  const [showPw, setShowPw] = useState(false);\n  const [saving, setSaving] = useState(false);\n  const [error, setError] = useState(\"\");\n  const [providers, setProviders] = useState([]);\n  const [socialBusy, setSocialBusy] = useState(null);\n\n  const isRegister = mode === \"register\";\n\n  const panels = [\n    { g: \"from-primary to-accent\", w: \"Bam!\" },\n    { g: \"from-primary-light to-primary\", w: \"Zaap!\" },\n    { g: \"from-accent-light to-accent\", w: \"Duar!\" },\n    { g: \"from-surface-3 to-primary\", w: \"Hah?!\" },\n    { g: \"from-accent to-primary-light\", w: \"Wush!\" },\n    { g: \"from-primary to-surface-3\", w: \"Krak!\" },\n    { g: \"from-primary-light to-accent-light\", w: \"Sret!\" },\n    { g: \"from-accent-light to-primary\", w: \"Boom!\" }\n  ];\n\n  const benefits = [\n    { icon: Bookmark, text: \"Bookmark seri favorit dan akses dari mana saja\" },\n    { icon: BookOpen, text: \"Lanjutkan dari chapter terakhir yang kamu baca\" },\n    { icon: Bell, text: \"Notifikasi saat chapter baru rilis\" }\n  ];\n\n  const svg = (children, vb) => (\n    <svg width=\"20\" height=\"20\" viewBox={vb || \"0 0 24 24\"} aria-hidden=\"true\">{children}</svg>\n  );\n  const PROVIDERS = {\n    google: { label: \"Google\", icon: svg(<g><path fill=\"#EA4335\" d=\"M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.7 3.5 14.6 2.5 12 2.5 6.8 2.5 2.6 6.7 2.6 12s4.2 9.5 9.4 9.5c5.4 0 9-3.8 9-9.2 0-.6-.1-1.1-.2-1.6H12z\" /></g>) },\n    microsoft: { label: \"Microsoft\", icon: svg(<g><path fill=\"#F25022\" d=\"M3 3h8.5v8.5H3z\" /><path fill=\"#7FBA00\" d=\"M12.5 3H21v8.5h-8.5z\" /><path fill=\"#00A4EF\" d=\"M3 12.5h8.5V21H3z\" /><path fill=\"#FFB900\" d=\"M12.5 12.5H21V21h-8.5z\" /></g>) },\n    apple: { label: \"Apple\", icon: svg(<path fill=\"currentColor\" d=\"M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.700 2.400 2.900 2.300 1.200 0 1.600-.7 3-.7s1.800.7 3 .7c1.300 0 2.100-1.100 2.800-2.300.9-1.300 1.300-2.500 1.300-2.600-.1 0-2.500-1-2.500-3.800zM14.200 5.800c.6-.8 1.100-1.900.9-3-1 0-2.100.7-2.800 1.500-.6.700-1.100 1.800-1 2.900 1.100.1 2.200-.6 2.900-1.400z\" />) },\n    github: { label: \"GitHub\", icon: svg(<path fill=\"currentColor\" d=\"M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.800c-2.800.6-3.400-1.200-3.400-1.200-.5-1.200-1.100-1.500-1.100-1.500-.9-.6.1-.6.1-.6 1 .1 1.500 1 1.500 1 .9 1.500 2.400 1.100 3 .8.1-.7.4-1.100.7-1.400-2.200-.3-4.600-1.100-4.600-5 0-1.100.4-2 1-2.700-.1-.3-.4-1.300.1-2.700 0 0 .8-.3 2.800 1a9.600 9.600 0 0 1 5 0c1.900-1.300 2.800-1 2.800-1 .5 1.400.2 2.400.1 2.700.6.700 1 1.600 1 2.700 0 3.900-2.400 4.700-4.600 5 .4.300.7.900.7 1.800v2.700c0 .3.200.6.700.5A10 10 0 0 0 12 2z\" />) },\n    facebook: { label: \"Facebook\", icon: svg(<g><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#1877F2\" /><path fill=\"#fff\" d=\"M13.500 21.900v-7.300h2.400l.4-2.900h-2.800V9.900c0-.8.2-1.400 1.400-1.400h1.500V5.900c-.3 0-1.200-.1-2.200-.1-2.200 0-3.700 1.300-3.700 3.800v2.100H8v2.900h2.500v7.300a10 10 0 0 0 3 0z\" /></g>) }\n  };\n  const ORDER = [\"google\", \"microsoft\", \"apple\", \"github\", \"facebook\"];\n  const list = ORDER.filter((id) => providers.includes(id) && PROVIDERS[id]);\n\n  const goBack = (fromForm) => {\n    const q = queryParams || {};\n    const target = (schema.pages || []).find((p) => p.name === (q.redirect || q.from));\n    if (target && target.name !== \"Login\") {\n      const rest = {};\n      Object.keys(q).forEach((k) => { if (k !== \"redirect\" && k !== \"from\") rest[k] = q[k]; });\n      navigateTo(target.name, undefined, undefined, rest);\n      return;\n    }\n    if (fromForm && window.history.length > 1 && document.referrer && document.referrer.indexOf(window.location.origin) === 0) {\n      window.history.back();\n      return;\n    }\n    navigateTo(\"Home\");\n  };\n\n  useEffect(() => {\n    let alive = true;\n    sdk.getAuthProviders().then((p) => { if (alive) setProviders(p || []); }).catch(() => {});\n    sdk.ready.then(() => {\n      if (!alive) return;\n      if (sdk.loginError) setError(sdk.loginError);\n      else if (sdk.isLoggedIn()) goBack(false);\n    });\n    return () => { alive = false; };\n  }, []);\n\n  const submit = async (e) => {\n    e.preventDefault();\n    if (saving) return;\n    setError(\"\");\n    if (isRegister && !name.trim()) return setError(\"Nama lengkap wajib diisi.\");\n    if (!/^\\S+@\\S+\\.\\S+$/.test(email.trim())) return setError(\"Masukkan alamat email yang valid.\");\n    if (password.length < 6) return setError(\"Kata sandi minimal 6 karakter.\");\n    setSaving(true);\n    try {\n      if (isRegister) await sdk.register(email.trim(), password, { full_name: name.trim() });\n      await handleLogin(email.trim(), password);\n      toast.success(isRegister ? \"Akun berhasil dibuat. Selamat membaca!\" : \"Selamat datang kembali!\");\n      goBack(true);\n    } catch (err) {\n      setError((err && err.message) || (isRegister ? \"Pendaftaran gagal. Coba lagi.\" : \"Email atau kata sandi salah.\"));\n    } finally {\n      setSaving(false);\n    }\n  };\n\n  const social = (id) => {\n    setError(\"\");\n    setSocialBusy(id);\n    sdk.loginWith(id);\n  };\n\n  const switchMode = (m) => { setMode(m); setError(\"\"); };\n\n  return (\n    <section className={t.page}>\n      <div className={t.collage} aria-hidden=\"true\">\n        <div className={t.collageGrid}>\n          {panels.map((p) => (\n            <div key={p.w} className={t.panel + \" \" + p.g}>\n              <div className={t.halftone} />\n              <span className={t.panelWord}>{p.w}</span>\n            </div>\n          ))}\n        </div>\n        <div className={t.fade} />\n      </div>\n\n      <motion.div\n        initial={{ opacity: 0, y: 20 }}\n        animate={{ opacity: 1, y: 0 }}\n        transition={{ duration: 0.45 }}\n        className={t.card}\n      >\n        <div className={t.logoTile}><MessageCircle size={28} /></div>\n        <p className={t.brand}>KomikMalam</p>\n        <h1 className={t.h1}>{isRegister ? \"Daftar di KomikMalam\" : \"Masuk ke KomikMalam\"}</h1>\n        <p className={t.sub}>Simpan bookmark dan riwayat bacaanmu di semua perangkat</p>\n\n        {isLoggedIn ? (\n          <div className=\"mt-8 space-y-3\">\n            <p className=\"text-center text-sm text-text-secondary\">Kamu sudah masuk. Selamat membaca!</p>\n            <button type=\"button\" className={t.btn} onClick={() => navigateTo(\"Home\")}>\n              <Home size={18} /> Ke Beranda\n            </button>\n            <button type=\"button\" className={t.ghost} onClick={() => handleLogout()}>\n              <LogOut size={16} /> Keluar\n            </button>\n          </div>\n        ) : (\n          <div className=\"mt-7\">\n            {list.length > 0 && (\n              <>\n                <div className=\"space-y-3\">\n                  {list.map((id) => (\n                    <button key={id} type=\"button\" className={t.social} disabled={!!socialBusy} onClick={() => social(id)}>\n                      {socialBusy === id ? <Loader2 size={20} className=\"animate-spin\" /> : PROVIDERS[id].icon}\n                      {isRegister ? \"Daftar dengan \" : \"Masuk dengan \"}{PROVIDERS[id].label}\n                    </button>\n                  ))}\n                </div>\n                <div className={t.divider}>\n                  <span className={t.line} /> atau <span className={t.line} />\n                </div>\n              </>\n            )}\n\n            <div className={t.seg} role=\"tablist\">\n              <button type=\"button\" role=\"tab\" aria-selected={!isRegister} className={!isRegister ? t.segOn : t.segOff} onClick={() => switchMode(\"login\")}>Masuk</button>\n              <button type=\"button\" role=\"tab\" aria-selected={isRegister} className={isRegister ? t.segOn : t.segOff} onClick={() => switchMode(\"register\")}>Daftar</button>\n            </div>\n\n            {error && (\n              <div className={t.err} role=\"alert\">\n                <AlertCircle size={16} className=\"mt-0.5 shrink-0\" />\n                <span>{error}</span>\n              </div>\n            )}\n\n            <form onSubmit={submit} className=\"space-y-4\" noValidate>\n              {isRegister && (\n                <div>\n                  <label className={t.label} htmlFor=\"lg-name\">Nama lengkap</label>\n                  <input id=\"lg-name\" className={t.input} value={name} onChange={(e) => setName(e.target.value)} placeholder=\"Contoh: Rina Maharani\" autoComplete=\"name\" />\n                </div>\n              )}\n              <div>\n                <label className={t.label} htmlFor=\"lg-email\">Email</label>\n                <input id=\"lg-email\" type=\"email\" className={t.input} value={email} onChange={(e) => setEmail(e.target.value)} placeholder=\"kamu@email.com\" autoComplete=\"email\" />\n              </div>\n              <div>\n                <label className={t.label} htmlFor=\"lg-pw\">Kata sandi</label>\n                <div className=\"relative\">\n                  <input\n                    id=\"lg-pw\"\n                    type={showPw ? \"text\" : \"password\"}\n                    className={t.input + \" pr-12\"}\n                    value={password}\n                    onChange={(e) => setPassword(e.target.value)}\n                    placeholder=\"Minimal 6 karakter\"\n                    autoComplete={isRegister ? \"new-password\" : \"current-password\"}\n                  />\n                  <button\n                    type=\"button\"\n                    onClick={() => setShowPw(!showPw)}\n                    aria-label={showPw ? \"Sembunyikan kata sandi\" : \"Tampilkan kata sandi\"}\n                    className=\"absolute right-2 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-lg text-text-muted transition hover:text-text\"\n                  >\n                    {showPw ? <EyeOff size={18} /> : <Eye size={18} />}\n                  </button>\n                </div>\n              </div>\n              <button type=\"submit\" className={t.btn} disabled={saving}>\n                {saving ? <Loader2 size={18} className=\"animate-spin\" /> : <LogIn size={18} />}\n                {saving ? (isRegister ? \"Membuat akun…\" : \"Memproses…\") : isRegister ? \"Buat Akun\" : \"Masuk\"}\n              </button>\n            </form>\n\n            <p className=\"mt-5 text-center text-[13px] text-text-muted\">\n              {isRegister ? \"Sudah punya akun?\" : \"Belum punya akun?\"}{\" \"}\n              <button type=\"button\" className=\"font-semibold text-text-link transition hover:text-text-link-hover\" onClick={() => switchMode(isRegister ? \"login\" : \"register\")}>\n                {isRegister ? \"Masuk di sini\" : \"Daftar gratis\"}\n              </button>\n            </p>\n          </div>\n        )}\n\n        <ul className={t.benefits}>\n          {benefits.map((b) => (\n            <li key={b.text} className={t.benefit}>\n              <span className={t.benefitIcon}><b.icon size={16} /></span>\n              {b.text}\n            </li>\n          ))}\n        </ul>\n      </motion.div>\n    </section>\n  );\n}","seo":{"title":"Masuk atau Daftar – KomikMalam","description":"Masuk ke KomikMalam dengan Google, Facebook, atau email. Simpan bookmark dan lanjutkan bacaan dari chapter terakhir di semua perangkat."}}
{"name":"Reader","route":"/read","auth":false,"lang":"id","home":false,"type":"page","title":"Baca Komik","info":"The reader view for one chapter, opened with a chapter id in the URL (e.g. /read?chapter=ID). Layout in order: (1) a sticky slim top bar that hides on scroll down and reappears on scroll up: back-to-home arrow, comic title + 'Chapter 58', a chapter dropdown listing all chapters of the comic, and a bookmark toggle button (saves/removes a Bookmark for this comic; guests are asked to log in with Google or Facebook). (2) A responsive banner ad (placement 'reader_top'). (3) The chapter's ChapterPage images rendered full-width in a single vertical strip, ordered by pageNumber, max width 800px centered on desktop, edge-to-edge on phone, lazy-loaded with a dark skeleton placeholder. (4) A responsive banner ad (placement 'reader_bottom') after the last page. (5) A large navigation block with '‹ Chapter Sebelumnya' and 'Chapter Berikutnya ›' buttons (disabled at the first/last chapter) plus 'Kembali ke Beranda'. (6) A floating mini nav on mobile (prev / chapter list / next / bookmark) at the bottom of the screen. Keyboard arrows left/right switch chapters on desktop. When a logged-in user opens a chapter, create or update their ReadingHistory row for this comic with the current chapterId and lastReadAt = now.","code":"function Reader() {\n  const t = {\n    page: \"relative min-h-screen bg-background text-text\",\n    bar: \"sticky top-0 z-30 border-b border-border bg-surface-2 shadow-shadow-md transition-transform duration-300\",\n    barIn: \"mx-auto flex h-14 max-w-5xl items-center gap-2 px-3 md:px-5\",\n    iconBtn: \"inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-text-secondary transition hover:bg-surface-3 hover:text-text disabled:cursor-not-allowed disabled:opacity-40\",\n    chapBtn: \"inline-flex h-10 items-center gap-1.5 rounded-full border border-border bg-surface-3 px-3.5 text-sm font-semibold text-text transition hover:border-primary\",\n    bmOn: \"inline-flex h-10 shrink-0 items-center gap-2 rounded-full bg-primary px-3.5 text-sm font-semibold text-white transition hover:bg-primary-hover disabled:opacity-60\",\n    bmOff: \"inline-flex h-10 shrink-0 items-center gap-2 rounded-full border border-border bg-surface-3 px-3.5 text-sm font-semibold text-text transition hover:border-primary disabled:opacity-60\",\n    menu: \"absolute inset-x-3 top-full z-40 mt-2 max-h-[60vh] overflow-y-auto rounded-xl border border-border bg-surface-2 p-1.5 shadow-shadow-xl sm:inset-x-auto sm:right-0 sm:w-80\",\n    itemOn: \"flex w-full items-center justify-between gap-3 rounded-lg bg-primary px-3 py-2.5 text-left text-white\",\n    itemOff: \"flex w-full items-center justify-between gap-3 rounded-lg px-3 py-2.5 text-left text-text transition hover:bg-surface-3\",\n    strip: \"mx-auto w-full max-w-[800px]\",\n    btnPrimary: \"inline-flex w-full items-center justify-center gap-2 rounded-btn-radius bg-btn-primary-bg px-6 py-4 text-base font-bold text-btn-primary-text transition hover:bg-btn-primary-hover disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-btn-primary-bg\",\n    btnSecondary: \"inline-flex w-full items-center justify-center gap-2 rounded-btn-radius border border-border bg-surface-3 px-6 py-4 text-base font-bold text-text transition hover:border-primary disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:border-border\",\n    btnGhost: \"inline-flex items-center justify-center gap-2 rounded-btn-radius px-5 py-3 text-sm font-semibold text-text-secondary transition hover:bg-surface-3 hover:text-text\",\n    dots: \"h-3 w-full bg-[radial-gradient(var(--primary)_1.5px,transparent_1.6px)] bg-[length:9px_9px] opacity-60\",\n    fab: \"fixed inset-x-4 bottom-4 z-30 flex items-center justify-between rounded-full border border-border bg-surface-3 p-1.5 shadow-shadow-xl md:hidden\",\n    fabBtn: \"inline-flex h-11 w-11 items-center justify-center rounded-full text-text transition hover:bg-surface-2 disabled:opacity-30\",\n    social: \"flex w-full items-center gap-3 rounded-btn-radius border border-border bg-surface-3 px-4 py-3.5 text-left text-sm font-semibold text-text transition hover:border-primary\"\n  };\n\n  const chapterId = queryParams && queryParams.chapter;\n  const [chapter, setChapter] = useState(null);\n  const [comic, setComic] = useState(null);\n  const [chapters, setChapters] = useState([]);\n  const [pages, setPages] = useState([]);\n  const [ads, setAds] = useState([]);\n  const [loading, setLoading] = useState(true);\n  const [err, setErr] = useState(\"\");\n  const [tick, setTick] = useState(0);\n  const [barHidden, setBarHidden] = useState(false);\n  const [pct, setPct] = useState(0);\n  const [menuOpen, setMenuOpen] = useState(false);\n  const [loginOpen, setLoginOpen] = useState(false);\n  const [bookmark, setBookmark] = useState(null);\n  const [saving, setSaving] = useState(false);\n  const lastY = useRef(0);\n  const menuRef = useRef(null);\n  const curRef = useRef(null);\n\n  useEffect(() => {\n    if (!chapterId) { setLoading(false); return; }\n    let alive = true;\n    window.scrollTo(0, 0);\n    setLoading(true);\n    setErr(\"\");\n    setPages([]);\n    (async () => {\n      try {\n        const ch = await sdk.getPublicOne(\"Chapter\", chapterId);\n        if (!ch || ch.id == null) throw new Error(\"Chapter tidak ditemukan.\");\n        const cid = ch.comicId && typeof ch.comicId === \"object\" ? ch.comicId.id : ch.comicId;\n        const [cm, chs, pg, ad] = await Promise.all([\n          sdk.getPublicOne(\"Comic\", cid),\n          sdk.getPublicAll(\"Chapter\", { filterField: \"comicId\", filterValue: cid, limit: 500, sort: { field: \"number\", direction: \"asc\" } }),\n          sdk.getPublicAll(\"ChapterPage\", { filterField: \"chapterId\", filterValue: ch.id, limit: 500, sort: { field: \"pageNumber\", direction: \"asc\" } }),\n          sdk.getPublicAll(\"AdBanner\", { limit: 50 })\n        ]);\n        if (!alive) return;\n        const list = ((chs && chs.data) || [])\n          .filter((c) => String(c.comicId && typeof c.comicId === \"object\" ? c.comicId.id : c.comicId) === String(cid))\n          .sort((a, b) => a.number - b.number);\n        const imgs = ((pg && pg.data) || [])\n          .filter((p) => String(p.chapterId && typeof p.chapterId === \"object\" ? p.chapterId.id : p.chapterId) === String(ch.id))\n          .sort((a, b) => a.pageNumber - b.pageNumber);\n        setChapter(ch);\n        setComic(cm);\n        setChapters(list.length ? list : [ch]);\n        setPages(imgs);\n        setAds(((ad && ad.data) || []).filter((a) => a.isActive !== false));\n      } catch (e) {\n        if (alive) setErr(e.message || \"Chapter gagal dimuat. Coba lagi.\");\n      } finally {\n        if (alive) setLoading(false);\n      }\n    })();\n    return () => { alive = false; };\n  }, [chapterId, tick]);\n\n  useEffect(() => {\n    if (!isLoggedIn || !comic || !chapter) return;\n    let alive = true;\n    (async () => {\n      try {\n        const res = await sdk.getByField(\"ReadingHistory\", \"comicId\", comic.id);\n        const row = ((res && res.data) || []).find((r) => String(r.comicId) === String(comic.id));\n        const payload = { comicId: comic.id, chapterId: chapter.id, lastReadAt: new Date().toISOString() };\n        if (!alive) return;\n        if (row) await sdk.update(\"ReadingHistory\", row.id, payload);\n        else await sdk.save(\"ReadingHistory\", payload);\n      } catch (e) {}\n    })();\n    return () => { alive = false; };\n  }, [isLoggedIn, comic && comic.id, chapter && chapter.id]);\n\n  useEffect(() => {\n    if (!isLoggedIn || !comic) { setBookmark(null); return; }\n    let alive = true;\n    (async () => {\n      try {\n        const res = await sdk.getByField(\"Bookmark\", \"comicId\", comic.id);\n        const row = ((res && res.data) || []).find((b) => String(b.comicId) === String(comic.id));\n        if (alive) setBookmark(row || null);\n      } catch (e) {}\n    })();\n    return () => { alive = false; };\n  }, [isLoggedIn, comic && comic.id]);\n\n  useEffect(() => {\n    const onScroll = () => {\n      const y = window.scrollY;\n      if (y > lastY.current + 8 && y > 90) setBarHidden(true);\n      else if (y < lastY.current - 8 || y < 90) setBarHidden(false);\n      lastY.current = y;\n      const max = document.documentElement.scrollHeight - window.innerHeight;\n      setPct(max > 0 ? Math.min(100, Math.round((y / max) * 100)) : 0);\n    };\n    window.addEventListener(\"scroll\", onScroll, { passive: true });\n    return () => window.removeEventListener(\"scroll\", onScroll);\n  }, []);\n\n  useEffect(() => {\n    if (!menuOpen) return;\n    const onDown = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };\n    document.addEventListener(\"mousedown\", onDown);\n    if (curRef.current) curRef.current.scrollIntoView({ block: \"center\" });\n    return () => document.removeEventListener(\"mousedown\", onDown);\n  }, [menuOpen]);\n\n  const idx = chapters.findIndex((c) => chapter && String(c.id) === String(chapter.id));\n  const prev = idx > 0 ? chapters[idx - 1] : null;\n  const next = idx >= 0 && idx < chapters.length - 1 ? chapters[idx + 1] : null;\n\n  const goChapter = (c) => {\n    if (!c) return;\n    setMenuOpen(false);\n    navigateTo(\"Reader\", undefined, undefined, { chapter: c.id });\n  };\n\n  useEffect(() => {\n    const onKey = (e) => {\n      if (e.key === \"Escape\") { setMenuOpen(false); setLoginOpen(false); return; }\n      const tag = e.target && e.target.tagName;\n      if (loginOpen || tag === \"INPUT\" || tag === \"TEXTAREA\") return;\n      if (e.key === \"ArrowLeft\" && prev) goChapter(prev);\n      if (e.key === \"ArrowRight\" && next) goChapter(next);\n    };\n    window.addEventListener(\"keydown\", onKey);\n    return () => window.removeEventListener(\"keydown\", onKey);\n  }, [prev, next, loginOpen]);\n\n  const toggleBookmark = async () => {\n    if (!isLoggedIn) { setLoginOpen(true); return; }\n    if (saving || !comic) return;\n    setSaving(true);\n    try {\n      if (bookmark) {\n        await sdk.del(\"Bookmark\", bookmark.id);\n        setBookmark(null);\n        toast.success(\"Bookmark dihapus\");\n      } else {\n        const r = await sdk.save(\"Bookmark\", { comicId: comic.id, createdDate: new Date().toISOString() });\n        setBookmark({ id: r.id, comicId: comic.id });\n        toast.success(\"Ditambahkan ke bookmark\");\n      }\n    } catch (e) {\n      toast.error(e.message || \"Bookmark gagal disimpan. Coba lagi.\");\n    } finally {\n      setSaving(false);\n    }\n  };\n\n  const adFor = (p) => ads.find((a) => a.placement === p) || null;\n  const chapLabel = chapter ? \"Chapter \" + chapter.number : \"Memuat…\";\n  const goHome = () => navigateTo(\"Home\");\n  const fmtDate = (d) => {\n    try { return dateFns.format(new Date(d), \"d MMM yyyy\", { locale: dateLocales[activeLang] }); } catch (e) { return \"\"; }\n  };\n\n  if (!chapterId) {\n    return (\n      <div className={t.page}>\n        <div className=\"mx-auto flex min-h-[70vh] max-w-md flex-col items-center justify-center gap-4 px-6 text-center\">\n          <div className=\"flex h-16 w-16 items-center justify-center rounded-full bg-surface-3 text-primary\"><FileText size={28} /></div>\n          <h1 className=\"text-4xl tracking-wide text-text\">Chapter belum dipilih</h1>\n          <p className=\"text-text-secondary\">Pilih salah satu judul di beranda untuk mulai membaca.</p>\n          <button onClick={goHome} className={t.btnPrimary + \" max-w-xs\"}><Home size={18} /> Kembali ke Beranda</button>\n        </div>\n      </div>\n    );\n  }\n\n  const bmBtn = (\n    <button onClick={toggleBookmark} disabled={saving} className={bookmark ? t.bmOn : t.bmOff} aria-pressed={!!bookmark} aria-label=\"Bookmark\">\n      {saving ? <Loader2 size={17} className=\"animate-spin\" /> : <Heart size={17} className={bookmark ? \"fill-current\" : \"\"} />}\n      <span className=\"hidden sm:inline\">{bookmark ? \"Tersimpan\" : \"Bookmark\"}</span>\n    </button>\n  );\n\n  return (\n    <div className={t.page}>\n      <header className={t.bar + (barHidden && !menuOpen ? \" -translate-y-full\" : \" translate-y-0\")}>\n        <div className={t.barIn}>\n          <button onClick={goHome} className={t.iconBtn} aria-label=\"Kembali ke beranda\"><ArrowLeft size={20} /></button>\n          <div className=\"min-w-0 flex-1\">\n            <h1 className=\"truncate text-xl leading-none tracking-wide text-text md:text-2xl\">{comic ? comic.title : \"…\"}</h1>\n            <p className=\"mt-0.5 truncate text-[13px] text-text-muted\">{chapLabel}{chapter && chapter.title ? \" · \" + chapter.title : \"\"}</p>\n          </div>\n          <div ref={menuRef} className=\"sm:relative\">\n            <button onClick={() => setMenuOpen(!menuOpen)} className={t.chapBtn} aria-expanded={menuOpen}>\n              <span className=\"hidden sm:inline\">Daftar Chapter</span>\n              <span className=\"sm:hidden\">{chapter ? \"Ch. \" + chapter.number : \"Ch.\"}</span>\n              <ChevronDown size={16} className={\"transition \" + (menuOpen ? \"rotate-180\" : \"\")} />\n            </button>\n            {menuOpen && (\n              <div className={t.menu}>\n                {chapters.slice().reverse().map((c) => {\n                  const on = chapter && String(c.id) === String(chapter.id);\n                  return (\n                    <button key={c.id} ref={on ? curRef : null} onClick={() => goChapter(c)} className={on ? t.itemOn : t.itemOff}>\n                      <span className=\"min-w-0\">\n                        <span className=\"block text-sm font-bold\">Chapter {c.number}</span>\n                        <span className={\"block truncate text-[13px] \" + (on ? \"text-white\" : \"text-text-muted\")}>{c.title || fmtDate(c.releaseDate)}</span>\n                      </span>\n                      {c.releaseDate && Date.now() - new Date(c.releaseDate).getTime() < 3 * 864e5 && <BaruBadge />}\n                    </button>\n                  );\n                })}\n              </div>\n            )}\n          </div>\n          {bmBtn}\n        </div>\n        <div className=\"absolute bottom-0 left-0 h-0.5 bg-accent transition-[width] duration-150\" style={{ width: pct + \"%\" }} />\n      </header>\n\n      <AdSlot ad={adFor(\"reader_top\")} />\n\n      <main className={t.strip}>\n        {loading && (\n          <div className=\"space-y-1\">\n            {[0, 1, 2].map((i) => <div key={i} className=\"min-h-[70vh] w-full animate-pulse bg-surface-2\" />)}\n          </div>\n        )}\n        {!loading && err && (\n          <div className=\"mx-4 my-16 flex flex-col items-center gap-4 rounded-2xl border border-border bg-surface-2 p-8 text-center md:mx-0\">\n            <AlertCircle size={32} className=\"text-error\" />\n            <h2 className=\"text-3xl tracking-wide\">Ups, chapter tidak terbuka</h2>\n            <p className=\"text-text-secondary\">{err}</p>\n            <div className=\"flex w-full max-w-sm flex-col gap-3 sm:flex-row\">\n              <button onClick={() => setTick(tick + 1)} className={t.btnPrimary}>Coba Lagi</button>\n              <button onClick={goHome} className={t.btnSecondary}>Beranda</button>\n            </div>\n          </div>\n        )}\n        {!loading && !err && pages.length === 0 && (\n          <div className=\"mx-4 my-16 flex flex-col items-center gap-3 rounded-2xl border border-dashed border-border p-10 text-center md:mx-0\">\n            <Image size={30} className=\"text-text-muted\" />\n            <h2 className=\"text-3xl tracking-wide\">Halaman belum tersedia</h2>\n            <p className=\"text-text-secondary\">Gambar untuk chapter ini sedang disiapkan. Kembali lagi sebentar lagi.</p>\n          </div>\n        )}\n        {!loading && !err && pages.map((p, i) => <PageImg key={p.id} src={p.imageUrl} n={p.pageNumber} eager={i < 2} />)}\n      </main>\n\n      <AdSlot ad={adFor(\"reader_bottom\")} />\n\n      {!loading && !err && chapter && (\n        <section className=\"mx-auto w-full max-w-[800px] px-4 pb-28 pt-8 md:pb-20\">\n          <div className=\"overflow-hidden rounded-2xl border border-border bg-surface-2\">\n            <div className={t.dots} />\n            <div className=\"p-5 md:p-8\">\n              <p className=\"text-xs font-semibold uppercase tracking-[0.2em] text-accent\">Akhir {chapLabel}</p>\n              <h2 className=\"mt-1 text-4xl tracking-wide text-text md:text-5xl\">{next ? \"Lanjut ke chapter berikutnya?\" : \"Kamu sudah terkini!\"}</h2>\n              <p className=\"mt-2 text-text-secondary\">\n                {next ? (comic ? comic.title : \"\") + \" · Chapter \" + next.number + \" sudah tersedia.\" : \"Belum ada chapter baru untuk \" + (comic ? comic.title : \"series ini\") + \". Bookmark agar tidak ketinggalan update.\"}\n              </p>\n              <div className=\"mt-6 grid gap-3 sm:grid-cols-2\">\n                <button onClick={() => goChapter(prev)} disabled={!prev} className={t.btnSecondary}><ChevronLeft size={20} /> Chapter Sebelumnya</button>\n                <button onClick={() => goChapter(next)} disabled={!next} className={t.btnPrimary}>Chapter Berikutnya <ChevronRight size={20} /></button>\n              </div>\n              <div className=\"mt-4 flex flex-col items-center justify-between gap-2 sm:flex-row\">\n                <button onClick={goHome} className={t.btnGhost}><Home size={16} /> Kembali ke Beranda</button>\n                <p className=\"hidden text-[13px] text-text-muted md:block\">Tips: tekan tombol ← dan → untuk pindah chapter</p>\n              </div>\n            </div>\n          </div>\n        </section>\n      )}\n\n      <div className={t.fab}>\n        <button onClick={() => goChapter(prev)} disabled={!prev} className={t.fabBtn} aria-label=\"Chapter sebelumnya\"><ChevronLeft size={22} /></button>\n        <button onClick={() => { setBarHidden(false); setMenuOpen(!menuOpen); }} className={t.fabBtn} aria-label=\"Daftar chapter\"><Menu size={20} /></button>\n        <button onClick={() => goChapter(next)} disabled={!next} className={t.fabBtn} aria-label=\"Chapter berikutnya\"><ChevronRight size={22} /></button>\n        <button onClick={toggleBookmark} disabled={saving} className={t.fabBtn + (bookmark ? \" text-primary\" : \"\")} aria-label=\"Bookmark\">\n          {saving ? <Loader2 size={20} className=\"animate-spin\" /> : <Heart size={20} className={bookmark ? \"fill-current\" : \"\"} />}\n        </button>\n      </div>\n\n      {loginOpen && (\n        <div className=\"fixed inset-0 z-50 flex items-end justify-center bg-black/70 p-4 sm:items-center\" onClick={() => setLoginOpen(false)}>\n          <div className=\"relative w-full max-w-sm overflow-hidden rounded-2xl border border-border bg-surface-2 shadow-shadow-xl\" onClick={(e) => e.stopPropagation()}>\n            <div className={t.dots} />\n            <button onClick={() => setLoginOpen(false)} className=\"absolute right-3 top-5 inline-flex h-9 w-9 items-center justify-center rounded-full text-text-secondary hover:bg-surface-3\" aria-label=\"Tutup\"><X size={18} /></button>\n            <div className=\"p-6\">\n              <h2 className=\"pr-8 text-4xl tracking-wide text-text\">Simpan series ini</h2>\n              <p className=\"mt-2 text-sm leading-relaxed text-text-secondary\">Masuk untuk menambah bookmark dan melanjutkan bacaan dari chapter terakhir di perangkat mana pun.</p>\n              <div className=\"mt-5 space-y-3\">\n                <button onClick={() => navigateTo(\"Login\")} className={t.social}>\n                  <span className=\"flex h-8 w-8 items-center justify-center rounded-full bg-text text-sm font-black text-background\">G</span>\n                  Lanjutkan dengan Google\n                </button>\n                <button onClick={() => navigateTo(\"Login\")} className={t.social}>\n                  <span className=\"flex h-8 w-8 items-center justify-center rounded-full bg-info text-base font-black text-white\">f</span>\n                  Lanjutkan dengan Facebook\n                </button>\n              </div>\n              <p className=\"mt-4 text-center text-[13px] text-text-muted\">Gratis, tanpa kata sandi tambahan.</p>\n            </div>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n}\n\nfunction BaruBadge() {\n  return (\n    <span\n      className=\"relative shrink-0 rounded-md bg-accent px-2 py-0.5 text-[11px] uppercase tracking-wider text-background after:absolute after:-bottom-1 after:left-2 after:h-2 after:w-2 after:rotate-45 after:bg-accent after:content-['']\"\n      style={{ fontFamily: \"var(--font-heading)\" }}\n    >\n      Baru\n    </span>\n  );\n}\n\nfunction PageImg({ src, n, eager }) {\n  const [loaded, setLoaded] = useState(false);\n  const [failed, setFailed] = useState(false);\n  const [key, setKey] = useState(0);\n  if (failed) {\n    return (\n      <div className=\"flex min-h-[40vh] w-full flex-col items-center justify-center gap-3 bg-surface-2 px-6 text-center\">\n        <AlertCircle size={26} className=\"text-text-muted\" />\n        <p className=\"text-sm text-text-secondary\">Halaman {n} gagal dimuat.</p>\n        <button\n          onClick={() => { setFailed(false); setLoaded(false); setKey(key + 1); }}\n          className=\"rounded-full border border-border bg-surface-3 px-4 py-2 text-sm font-semibold text-text transition hover:border-primary\"\n        >\n          Muat ulang\n        </button>\n      </div>\n    );\n  }\n  return (\n    <div className={loaded ? \"\" : \"min-h-[70vh] w-full animate-pulse bg-surface-2\"}>\n      <img\n        key={key}\n        src={src}\n        alt={\"Halaman \" + n}\n        loading={eager ? \"eager\" : \"lazy\"}\n        onLoad={() => setLoaded(true)}\n        onError={() => setFailed(true)}\n        className={\"block h-auto w-full transition-opacity duration-300 \" + (loaded ? \"opacity-100\" : \"opacity-0\")}\n      />\n    </div>\n  );\n}\n\nfunction AdSlot({ ad }) {\n  if (!ad) return null;\n  const hasImg = ad.imageDesktopUrl || ad.imageMobileUrl;\n  if (!ad.adCode && !hasImg) return null;\n  return (\n    <div className=\"mx-auto my-4 w-full max-w-[800px] px-3 md:px-0\">\n      <div className=\"rounded-lg border border-dashed border-border p-2\">\n        <span className=\"mb-1 block text-center text-[10px] font-semibold uppercase tracking-[0.25em] text-text-muted\">Iklan</span>\n        {ad.adCode ? (\n          <iframe\n            title=\"Iklan\"\n            srcDoc={ad.adCode}\n            sandbox=\"allow-scripts allow-popups allow-popups-to-escape-sandbox\"\n            className=\"h-[100px] w-full border-0 md:h-[110px]\"\n          />\n        ) : (\n          <a href={ad.linkUrl || \"#\"} target=\"_blank\" rel=\"sponsored noopener noreferrer\" className=\"block overflow-hidden rounded-md\">\n            <picture>\n              {ad.imageDesktopUrl && <source media=\"(min-width:768px)\" srcSet={ad.imageDesktopUrl} />}\n              <img src={ad.imageMobileUrl || ad.imageDesktopUrl} alt={ad.name || \"Iklan\"} loading=\"lazy\" className=\"block h-auto w-full\" />\n            </picture>\n          </a>\n        )}\n      </div>\n    </div>\n  );\n}","seo":{"title":"Baca Komik Online – Chapter Terbaru | KomikMalam","description":"Baca chapter komik favoritmu dalam satu strip vertikal yang nyaman. Navigasi chapter cepat, bookmark series, dan riwayat baca otomatis di KomikMalam."}}
